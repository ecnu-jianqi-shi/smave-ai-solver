name: diag-dae-probe
on:
  push:
    paths:
      - '.github/workflows/diag-dae-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: configure
        run: cmake --preset release
      - name: build all solve_service_reuse deps
        run: cmake --build build/release --target smave smave_c_api_linear_service_probe smave_c_api_nonlinear_service_probe smave_c_api_complementarity_service_probe smave_c_api_block_graph_service_probe smave_c_api_ode_service_probe smave_c_api_dae_service_probe smave_c_api_index_two_dae_service_probe smave_c_api_cancellation_service_probe smave_c_api_external_linear_fallback_probe smave_c_api_external_stepper_fallback_probe smave_c_api_error_stack_probe smave_c_api_event_service_probe smave_c_api_dae_event_service_probe smave_c_api_hybrid_service_probe smave_c_api_hybrid_dae_service_probe -j2
      - name: run ctest for solve_service_reuse with verbose
        run: |
          cd build/release
          ctest -R smave_solve_service_reuse --output-on-failure --verbose
          echo "EXIT=$?"
      - name: also run probe standalone
        run: |
          ./build/release/smave_c_api_dae_service_probe
          echo "standalone_exit=$?"
